name: fix-code-style

on:
  push:
    branches-ignore:
      - main
    paths:
      - '**.php'
      - '.github/workflows/fix-code-style.yml'

permissions:
  contents: write

jobs:
  fix-code-style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install supported dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Restore repository lock file
        run: git restore composer.lock

      - name: Find changed PHP files
        id: changed-php
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMRT -z origin/main...HEAD -- '*.php'
          )

          if (( ${#files[@]} == 0 )); then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed PHP files to format."
            exit 0
          fi

          printf '%s\0' "${files[@]}" > /tmp/pint-files
          printf 'Changed PHP files:\n%s\n' "${files[@]}"
          echo "has_files=true" >> "$GITHUB_OUTPUT"

      - name: Fix PHP code style issues
        if: steps.changed-php.outputs.has_files == 'true'
        run: xargs -0 -r ./vendor/bin/pint < /tmp/pint-files

      - name: Commit changes
        if: steps.changed-php.outputs.has_files == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Fix styling
