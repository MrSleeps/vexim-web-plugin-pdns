name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }} / Laravel 13

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-tests-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-tests-${{ matrix.php }}-
            composer-tests-

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Use DNS Core access-control branch
        run: |
          composer config repositories.dns-core vcs https://github.com/MrSleeps/vexim-web-plugin-dns-core
          composer require --no-update mrsleeps/vexim-web-plugin-dns-core:"dev-tests/dns-access-control"

      - name: Install supported dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        shell: bash
        run: find src tests database config -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Execute tests
        run: vendor/bin/pest --ci
